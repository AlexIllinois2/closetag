[package]
name = "closetag"
version = "0.1.0"
edition = "2021"
description = "Local tag management system: bun + actix-web in a single binary"
build = "build.rs"

[dependencies]
actix-web = "4.17.0"
actix-ws = "0.4.0"
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
open = "5.4.4"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = "thin"
